[project]
name = "eagw2026-hands-on"
version = "0.1.0"
description = "EAGW2026 Hands-on — cross-correlate ZTF flares with GWs (AGN channels)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "jupyter",
  "jupyterlab",
  "notebook",
  "astropy",
  "h5py",
  "pandas",
  "tqdm",
  "requests",
  "gwosc",
  "gwpy",
  "ligo.skymap",
  "pesummary",
  "precession",
  "zenodo-get",
  "ztfquery",
]

[dependency-groups]
dev = ["ipython"]
